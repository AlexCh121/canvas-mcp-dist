name: Publish MCP release

on:
  push:
    branches: [main]
    paths: [release.json]

permissions:
  contents: read

concurrency:
  group: publish-mcp-prerelease
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify package and installation pointer
        id: assets
        run: |
          python3 scripts/update-latest.py --check
          python3 scripts/verify-release.py
      - name: Publish versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.assets.outputs.version }}
          RELEASE_ARCHIVE: ${{ steps.assets.outputs.archive }}
          RELEASE_CHECKSUM: ${{ steps.assets.outputs.checksumFile }}
          RELEASE_NOTES: ${{ steps.assets.outputs.notesFile }}
          RELEASE_PRERELEASE: ${{ steps.assets.outputs.prerelease }}
          RELEASE_DOCUMENTATION_ONLY: ${{ steps.assets.outputs.documentationOnly }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$RELEASE_PRERELEASE" != false ] && [ "$RELEASE_DOCUMENTATION_ONLY" != true ]; then
              echo "Release already exists; refusing to replace versioned assets."
              exit 1
            fi
            verify_dir="$(mktemp -d)"
            trap 'rm -rf "$verify_dir"' EXIT
            gh release download "$tag" --pattern "$RELEASE_ARCHIVE" \
              --pattern "$RELEASE_CHECKSUM" --dir "$verify_dir"
            cmp "$verify_dir/$RELEASE_ARCHIVE" "$RELEASE_ARCHIVE"
            cmp "$verify_dir/$RELEASE_CHECKSUM" "$RELEASE_CHECKSUM"
            # Refresh public text for documentation fixes and stable promotions alike.
            # The original tag, archive and checksum assets are never replaced.
            gh release upload "$tag" --clobber \
              "releases/${RELEASE_VERSION}/README.en.md" \
              "releases/${RELEASE_VERSION}/INSTALL.zh-CN.md" "$RELEASE_NOTES"
            if [ "$RELEASE_DOCUMENTATION_ONLY" = true ]; then
              gh release edit "$tag" --notes-file "$RELEASE_NOTES"
            else
              gh release edit "$tag" --draft=false --prerelease=false --latest \
                --title "huihui Infinite Canvas MCP ${tag}" --notes-file "$RELEASE_NOTES"
            fi
          else
            if [ "$RELEASE_DOCUMENTATION_ONLY" = true ]; then
              echo "Documentation refresh requires an existing release."
              exit 1
            fi
            title="huihui Infinite Canvas MCP ${tag}"
            if [ "$RELEASE_PRERELEASE" = true ]; then title="$title (prerelease)"; fi
            gh release create "$tag" --draft --prerelease="$RELEASE_PRERELEASE" \
              --target "$GITHUB_SHA" --title "$title" --notes-file "$RELEASE_NOTES"
            gh release upload "$tag" "$RELEASE_ARCHIVE" "$RELEASE_CHECKSUM" \
              "releases/${RELEASE_VERSION}/SHA256SUMS" \
              "releases/${RELEASE_VERSION}/README.en.md" \
              "releases/${RELEASE_VERSION}/INSTALL.zh-CN.md" \
              "$RELEASE_NOTES"
            if [ "$RELEASE_PRERELEASE" = true ]; then
              gh release edit "$tag" --draft=false --prerelease --latest=false
            else
              gh release edit "$tag" --draft=false --prerelease=false --latest
            fi
          fi
